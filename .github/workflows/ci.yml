name: Used Car Price ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test car dataset
        run: python -m unittest test_data -v

      - name: Train used car price model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: used_car_price_model.pkl
          path: |
            used_car_price_model.pkl
            metrics.json
            used_car_prices_new_250.csv
          if-no-files-found: error
          retention-days: 7
